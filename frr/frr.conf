frr version 10.2.1
frr defaults datacenter
hostname router
interface eth1
 description Network_1
 ip address 192.168.1.1/24
interface eth2
 description Network_2
 ip address 192.168.2.1/24
interface eth3
 description Network_3
 ip address 192.168.3.1/24
interface eth4
 description Trunk_to_Switch
interface eth4.10
 description VLAN_10_Internet
 ip address 192.168.10.1/24
interface eth4.20
 description VLAN_20_NoInternet
 ip address 192.168.20.1/24
interface eth4.30
 description VLAN_30_VoIP
 ip address 192.168.30.1/24
interface eth4.40
 description VLAN_40_Monitoring
 ip address 192.168.40.1/24
ip forwarding
line vty
end
